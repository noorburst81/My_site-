<style>
  :root{
    --teal-deep:#6B1E3C;
    --teal:#A6335C;
    --teal-light:#D97BA0;
    --mint-bg:#FFF5F0;
    --white:#FFFFFF;
    --ink:#3D2027;
    --ink-soft:#8A6B72;
    --coral:#FF6B57;
    --sand:#FFF6E9;
    --sand-line:#F3E3C7;
    --line:#F3DEE5;
    --radius:18px;
    --shadow:0 8px 24px rgba(11,93,95,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--mint-bg);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  body.rtl{ font-family:'Noto Naskh Arabic','Inter',sans-serif; }
  #app{
    max-width:430px;
    margin:0 auto;
    min-height:100vh;
    background:var(--mint-bg);
    position:relative;
    display:flex;
    flex-direction:column;
  }
  h1,h2,h3,.display{ font-family:'Poppins',sans-serif; font-weight:700; margin:0; }
  body.rtl h1, body.rtl h2, body.rtl h3, body.rtl .display{ font-family:'Noto Naskh Arabic',sans-serif; font-weight:700; }
  p{ margin:0; }
  button{ font-family:inherit; cursor:pointer; border:none; }

  /* ---------- Splash / language gate ---------- */
  #gate{
    position:fixed; inset:0; z-index:50;
    background:linear-gradient(160deg, #EAF7EA 0%, #F5FBEE 60%, #FDFBF3 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; padding:32px; text-align:center;
    max-width:430px; margin:0 auto;
  }
  .gate-lockup{
    display:flex; flex-direction:column; align-items:center; gap:12px; margin-bottom:26px;
  }
  .gate-logo{
    width:64px; height:64px; border-radius:18px; background:var(--teal-deep);
    display:flex; align-items:center; justify-content:center;
    font-size:30px; flex-shrink:0; box-shadow:0 8px 20px rgba(107,30,60,0.28);
  }
  .gate-title{ font-size:26px; letter-spacing:0.2px; color:#FF7A45; }
  .gate-sub{ font-size:16px; font-weight:700; color:#3FA9F5; opacity:1; margin-bottom:40px; max-width:300px; line-height:1.5; }
  .lang-choice{ display:flex; flex-wrap:wrap; gap:12px; width:100%; justify-content:center; }
  .lang-btn{
    flex:1 1 100px; max-width:130px; background:#FFFFFF;
    color:var(--teal-deep); border-radius:20px; padding:20px 10px; display:flex; flex-direction:column; gap:6px;
    align-items:center; box-shadow:0 10px 22px rgba(0,0,0,0.16); transition:transform .15s ease;
  }
  .lang-btn:active{ transform:scale(0.96); }
  .lang-btn .glyph{ font-size:22px; font-family:'Noto Naskh Arabic',sans-serif; font-weight:700; }
  .lang-btn .glyph-ar{ font-family:'Noto Naskh Arabic',sans-serif; font-size:19px; }
  .lang-btn .name{ font-family:'Poppins',sans-serif; font-weight:700; font-size:19px; }
  .lang-btn .native{ font-size:13px; color:var(--ink-soft); }
  .gate-note{ margin-top:28px; font-size:13.5px; font-weight:700; color:#3FA9F5; opacity:1; }

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px 14px; background:var(--mint-bg); position:sticky; top:0; z-index:10;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .mark{
    width:34px;height:34px;border-radius:10px;background:var(--teal);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;
  }
  .brand .name{ font-size:17px; }
  .lang-pill{
    display:flex; align-items:center; gap:6px; background:var(--white); border:1px solid var(--line);
    border-radius:999px; padding:7px 12px; font-size:12.5px; font-weight:600; color:var(--teal-deep);
  }

  /* ---------- Screens ---------- */
  .screen{ padding:4px 20px 100px; flex:1; }
  .hidden{ display:none !important; }

  .hero-card{
    background:linear-gradient(135deg, var(--teal-deep), var(--teal));
    color:#fff; border-radius:22px; padding:22px; margin:10px 0 20px; box-shadow:var(--shadow);
  }
  .hero-card .eyebrow{ font-size:13px; font-weight:700; opacity:1; margin-bottom:4px; letter-spacing:.02em; }
  .hero-card h2{ font-size:20px; margin-bottom:8px; }
  .hero-card p.sub{ font-size:13px; opacity:0.9; line-height:1.5; }

  .section-title{ font-size:14px; color:var(--ink-soft); margin:22px 0 10px; text-transform:uppercase; letter-spacing:.04em; }
  body.rtl .section-title{ text-transform:none; letter-spacing:0; }

  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .action-card{
    background:var(--white); border-radius:16px; padding:16px; border:1px solid var(--line);
    display:flex; flex-direction:column; gap:8px; text-align:start;
  }
  .action-card .icon{ font-size:22px; }
  .action-card .label{ font-family:'Poppins',sans-serif; font-weight:600; font-size:13.5px; color:var(--teal-deep); }
  body.rtl .action-card .label{ font-family:'Noto Naskh Arabic',sans-serif; }
  .action-card .desc{ font-size:11.5px; color:var(--ink-soft); line-height:1.4; }

  .list-card{
    background:var(--white); border-radius:16px; padding:14px 16px; border:1px solid var(--line);
    margin-bottom:10px; display:flex; align-items:center; gap:12px;
  }
  .list-card .avatar{
    width:38px;height:38px;border-radius:12px;background:var(--sand);color:var(--teal-deep);
    display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;
  }
  .list-card .meta .title{ font-weight:600; font-size:14px; }
  .list-card .meta .sub{ font-size:12px; color:var(--ink-soft); margin-top:2px; }

  .symptom-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:4px; }
  .symptom-chip{
    background:var(--white); border:1px solid var(--line); border-radius:16px; padding:16px 12px;
    display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center;
  }
  .symptom-chip.active{ background:var(--teal); border-color:var(--teal); color:#fff; }
  .symptom-chip .emoji{ font-size:24px; }
  .symptom-chip .label{ font-size:12.5px; font-weight:600; }

  .info-panel{
    background:var(--sand); border:1px solid var(--sand-line); border-radius:16px; padding:16px; margin-top:14px;
  }
  .info-panel h3{ font-size:15px; margin-bottom:8px; color:var(--teal-deep); }
  .info-panel ul{ margin:0; padding-inline-start:18px; font-size:13px; line-height:1.6; color:var(--ink); }
  .disclaimer{
    display:flex; gap:8px; background:#FFF0EC; border:1px solid #FFD9CE; border-radius:12px;
    padding:10px 12px; margin-top:12px; font-size:11.5px; color:#A6402E; line-height:1.5;
  }
  .emergency-banner{
    display:flex; gap:10px; align-items:flex-start; background:#E74C3C; color:#fff; border-radius:14px;
    padding:14px; margin-top:14px; font-size:13px; font-weight:600; line-height:1.5;
  }
  .emergency-banner .bolt{ font-size:20px; flex-shrink:0; }
  .support-note{
    background:#EAF4FF; border:1px solid #CBE3FF; color:#1F5C99; border-radius:14px;
    padding:12px 14px; margin-top:14px; font-size:12.5px; font-weight:500; line-height:1.6;
  }

  .btn-primary{
    background:var(--teal); color:#fff; border-radius:14px; padding:13px 18px; font-weight:600;
    font-size:14px; width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-secondary{
    background:var(--white); color:var(--teal-deep); border:1.5px solid var(--teal); border-radius:14px;
    padding:12px 18px; font-weight:600; font-size:13.5px; width:100%;
  }

  input[type=text], input[type=number], select{
    width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line);
    background:var(--white); font-size:14px; font-family:inherit; color:var(--ink); margin-top:6px;
  }
  label.field-label{ font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-top:14px; display:block; }

  .rx-card{
    background:var(--white); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px;
  }
  .rx-card .rx-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .rx-card .rx-name{ font-weight:600; font-size:14px; }
  .rx-card .rx-date{ font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .badge-readonly{
    font-size:10px; font-weight:700; background:var(--sand); color:#A67A22; padding:3px 9px; border-radius:999px;
    text-transform:uppercase; letter-spacing:.03em; white-space:nowrap;
  }
  .rx-note{ font-size:12.5px; color:var(--ink-soft); margin-top:8px; line-height:1.5; }
  .rx-thumb{
    margin-top:10px; border-radius:10px; max-width:100%; display:block; border:1px solid var(--line);
  }

  /* ---------- Medicine info ---------- */
  .med-search-card{ background:var(--white); border:1px solid var(--line); border-radius:16px; padding:16px; margin-top:14px; }
  .med-divider-label{ text-align:center; font-size:11.5px; color:var(--ink-soft); margin:16px 0 4px; }
  .med-result-card{ background:var(--white); border:1px solid var(--line); border-radius:18px; padding:18px; margin-top:16px; }
  .med-name{ font-family:'Poppins',sans-serif; font-weight:700; font-size:18px; color:var(--teal-deep); }
  body.rtl .med-name{ font-family:'Noto Naskh Arabic',sans-serif; }
  .med-generic{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .med-tag{ display:inline-block; background:var(--sand); color:#A67A22; font-size:11px; font-weight:700; padding:4px 11px; border-radius:999px; margin-top:8px; }
  .med-section-label{ font-family:'Poppins',sans-serif; font-weight:600; font-size:13px; color:var(--teal-deep); margin-top:14px; margin-bottom:6px; }
  body.rtl .med-section-label{ font-family:'Noto Naskh Arabic',sans-serif; }
  .med-list{ margin:0; padding-inline-start:18px; font-size:13px; line-height:1.6; color:var(--ink); }
  .med-recent-chip{
    display:inline-flex; align-items:center; background:var(--mint-bg); border:1px solid var(--line); border-radius:999px;
    padding:7px 13px; font-size:12.5px; font-weight:600; color:var(--teal-deep); margin:0 6px 8px 0;
  }
  .generic-tip{
    background:#EAF7F0; border:1px solid #C7EBD8; color:#1F7A4C; border-radius:12px;
    padding:10px 12px; margin-top:10px; font-size:11.5px; line-height:1.6;
  }

  /* ---------- Partner spotlight marquee ---------- */
  .partner-section{ margin-top:20px; }
  .partner-header{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .partner-header .label{ font-size:12px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; }
  body.rtl .partner-header .label{ text-transform:none; letter-spacing:0; }
  .partner-header .note{ font-size:10.5px; color:var(--ink-soft); opacity:.8; }
  .marquee-wrap{ overflow:hidden; width:100%; border-radius:14px; }
  .marquee-track{ display:flex; gap:12px; width:max-content; animation:marqueeScroll 18s linear infinite; }
  body.rtl .marquee-track{ animation-direction:reverse; }
  .marquee-track:hover{ animation-play-state:paused; }
  @keyframes marqueeScroll{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
  .partner-card{
    flex-shrink:0; width:112px; height:68px; background:var(--white); border:1px dashed var(--line);
    border-radius:12px; display:flex; align-items:center; justify-content:center; text-align:center;
    padding:8px; font-size:10.5px; font-weight:600; color:var(--ink-soft); line-height:1.4;
  }

  /* ---------- Pharmacy locator ---------- */
  #pharmMapDiv{ height:210px; border-radius:16px; overflow:hidden; margin-top:14px; border:1px solid var(--line); }
  .sample-note{
    background:#FFF6E9; border:1px solid var(--sand-line); color:#A67A22; border-radius:12px;
    padding:10px 12px; margin-top:12px; font-size:11.5px; line-height:1.5;
  }
  .pharm-card{ background:var(--white); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px; }
  .pharm-card .pharm-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .pharm-card .pharm-name{ font-weight:700; font-size:14.5px; color:var(--teal-deep); }
  .pharm-card .pharm-dist{ font-size:11.5px; font-weight:700; color:var(--teal); white-space:nowrap; }
  .pharm-card .pharm-hours{ font-size:12px; color:var(--ink-soft); margin-top:3px; }
  .pharm-actions{ display:flex; gap:8px; margin-top:10px; }
  .pharm-actions a{
    flex:1; text-align:center; text-decoration:none; border-radius:11px; padding:9px 10px; font-size:12.5px; font-weight:600;
  }
  .pharm-actions .call-link{ background:var(--mint-bg); color:var(--teal-deep); border:1px solid var(--line); }
  .pharm-actions .dir-link{ background:var(--teal); color:#fff; }

  .empty-state{
    text-align:center; padding:40px 20px; color:var(--ink-soft);
  }
  .empty-state .emoji{ font-size:34px; margin-bottom:10px; }
  .empty-state .msg{ font-size:13px; line-height:1.5; }

  /* ---------- Bottom nav ---------- */
  .bottomnav{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:430px; box-sizing:border-box;
    background:var(--white); border-top:1px solid var(--line); display:flex;
    padding:10px 8px calc(10px + env(safe-area-inset-bottom)); z-index:30;
  }
  .navbtn{
    flex:1; background:none; display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:8px 2px; color:var(--ink-soft); font-size:11.5px; font-weight:600; border-radius:12px;
  }
  .navbtn .icon{ font-size:22px; }
  .navbtn.active{ color:var(--teal-deep); }
  .navbtn.active .icon{ transform:translateY(-1px); }

  /* modal */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(11,40,40,0.45); z-index:40; display:flex; align-items:flex-end;
    max-width:430px; margin:0 auto;
  }
  .modal-sheet{
    background:var(--white); width:100%; border-radius:22px 22px 0 0; padding:22px 20px calc(24px + env(safe-area-inset-bottom));
    max-height:82vh; overflow-y:auto;
  }
  .modal-sheet h3{ font-size:17px; margin-bottom:4px; }
  .modal-close{
    position:absolute; top:16px; inset-inline-end:20px; background:var(--mint-bg); width:30px; height:30px;
    border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--ink-soft);
  }
  .modal-sheet{ position:relative; }
  .file-drop{
    display:block; width:100%; box-sizing:border-box;
    border:1.5px dashed var(--teal-light); border-radius:14px; padding:22px; text-align:center; margin-top:14px;
    color:var(--teal-deep); font-size:12.5px; background:var(--mint-bg);
  }
  .toast{
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--ink);
    color:#fff; padding:10px 18px; border-radius:999px; font-size:12.5px; z-index:60; opacity:0;
    transition:opacity .25s ease; pointer-events:none; max-width:80%;
  }
  .toast.show{ opacity:1; }

  /* ---------- Guided checker ---------- */
  .checker-card{
    background:linear-gradient(135deg, var(--teal-deep), var(--teal)); color:#fff; border-radius:20px;
    padding:20px; margin-top:14px; box-shadow:var(--shadow);
  }
  .checker-card h3{ font-size:16px; margin-bottom:6px; }
  .checker-card p{ font-size:12.5px; opacity:0.9; line-height:1.5; margin-bottom:14px; }
  .progress-row{ display:flex; align-items:center; gap:8px; margin-bottom:16px; }
  .progress-track{ flex:1; height:5px; background:var(--line); border-radius:99px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--teal); border-radius:99px; transition:width .25s ease; }
  .progress-label{ font-size:11px; color:var(--ink-soft); white-space:nowrap; }
  .q-card{ background:var(--white); border:1px solid var(--line); border-radius:18px; padding:18px; margin-top:14px; }
  .q-text{ font-family:'Poppins',sans-serif; font-weight:700; font-size:16px; color:var(--teal-deep); margin-bottom:14px; line-height:1.4; }
  body.rtl .q-text{ font-family:'Noto Naskh Arabic',sans-serif; }
  .q-options{ display:flex; flex-direction:column; gap:10px; }
  .q-opt{
    background:#EAF2FB; border:1.5px solid #CFE0F5; border-radius:14px; padding:13px 14px;
    font-size:13.5px; font-weight:600; color:var(--ink); text-align:start;
  }
  .q-opt.selected{ background:var(--teal); border-color:var(--teal); color:#fff; }
  .q-nav{ display:flex; gap:10px; margin-top:18px; }
  .q-nav .btn-secondary, .q-nav .btn-primary{ flex:1; }

  .result-card{ background:var(--white); border:1px solid var(--line); border-radius:18px; padding:20px; margin-top:14px; }
  .result-badge{
    display:inline-block; background:var(--sand); color:#A67A22; font-size:11px; font-weight:700;
    padding:4px 11px; border-radius:999px; text-transform:uppercase; letter-spacing:.03em; margin-bottom:10px;
  }
  body.rtl .result-badge{ text-transform:none; }
  .result-bucket{ font-family:'Poppins',sans-serif; font-weight:700; font-size:18px; color:var(--teal-deep); margin-bottom:8px; }
  body.rtl .result-bucket{ font-family:'Noto Naskh Arabic',sans-serif; }
  .result-desc{ font-size:13px; line-height:1.6; color:var(--ink); margin-bottom:14px; }
  .divider{ height:1px; background:var(--line); margin:14px 0; }
  .browse-link{ text-align:center; margin-top:16px; font-size:12.5px; color:var(--teal-deep); font-weight:600; text-decoration:underline; }

  /* ---------- Severity gauge ---------- */
  .gauge-wrap{ display:flex; flex-direction:column; align-items:center; margin:6px 0 16px; }
  .gauge-needle{ transition:transform 0.6s cubic-bezier(.34,1.56,.64,1); transform-origin:100px 100px; }
  .gauge-label{ font-family:'Poppins',sans-serif; font-weight:700; font-size:14px; margin-top:6px; }
  body.rtl .gauge-label{ font-family:'Noto Naskh Arabic',sans-serif; }
  .gauge-sub{ font-size:11px; color:var(--ink-soft); margin-top:2px; text-transform:uppercase; letter-spacing:.04em; }
  body.rtl .gauge-sub{ text-transform:none; letter-spacing:0; }

  .checker-exit-row{ display:flex; justify-content:flex-end; margin-top:12px; }
  .exit-chip{
    display:flex; align-items:center; gap:6px; background:var(--white); border:1px solid var(--line);
    border-radius:999px; padding:7px 13px; font-size:12px; font-weight:600; color:var(--ink-soft);
  }

  /* ---------- Arabic font overrides (Naskh, not Nastaliq) ---------- */
  body.lang-ar{ font-family:'Noto Naskh Arabic','Inter',sans-serif; }
  body.lang-ar h1, body.lang-ar h2, body.lang-ar h3, body.lang-ar .display{ font-family:'Noto Naskh Arabic',sans-serif; font-weight:700; }

function findMedicine(query){
  const q = query.trim().toLowerCase();
  if(!q) return null;
  return MEDICINE_DB.find(m => m.aliases.some(a => a===q || a.includes(q) || q.includes(a))) || null;
}

/* ================= Storage ================= */
/* Works both inside Claude's artifact sandbox (window.storage) and on any
   normal web host (falls back to browser localStorage) so the same file
   works whether opened via Claude or hosted independently. */
async function storageGet(key){
  if(typeof window.storage !== 'undefined' && window.storage && window.storage.get){
    try{ return await window.storage.get(key); }catch(e){}
  }
  try{
    const v = localStorage.getItem(key);
    return v !== null ? { key, value:v } : null;
  }catch(e){ return null; }
}
async function storageSet(key, value){
  if(typeof window.storage !== 'undefined' && window.storage && window.storage.set){
    try{ return await window.storage.set(key, value); }catch(e){}
  }
  try{ localStorage.setItem(key, value); return { key, value }; }catch(e){ return null; }
}
async function loadState(){
  try{
    const r = await storageGet('mediguide:lang');
    if(r && r.value) LANG = r.value;
  }catch(e){}
  try{
    const r = await storageGet('mediguide:data');
    if(r && r.value){ const d = JSON.parse(r.value); state.family = d.family||[]; state.rx = d.rx||[]; state.activity = d.activity||[]; state.medHistory = d.medHistory||[]; }
  }catch(e){}
}
async function saveData(){
  try{ await storageSet('mediguide:data', JSON.stringify({family:state.family, rx:state.rx, activity:state.activity, medHistory:state.medHistory})); }
  catch(e){ console.error('storage save failed', e); }
}
async function saveLang(){
  try{ await storageSet('mediguide:lang', LANG); }catch(e){}
}
function pushActivity(text_en, text_ur){
  state.activity.unshift({en:text_en, ur:text_ur, ts:Date.now()});
  state.activity = state.activity.slice(0,6);
  saveData();
}
function showToast(msg){

}

/* ================= Modal helper ================= */
function openModal(html){
  closeModal();
  const wrap = document.createElement('div');
  wrap.id = 'modalRoot';
  wrap.innerHTML = html;
  document.body.appendChild(wrap);
}
function closeModal(){
  const existing = document.getElementById('modalRoot');
  if(existing) existing.remove();
}

function showTab(tab){
  ['home','symptoms','medicine','rx','family','pharmacy','wellness'].forEach(s=>{
    document.getElementById('screen-'+s).classList.toggle('hidden', s!==tab);
  });
  document.querySelectorAll('.navbtn').forEach(b=>{
    b.classList.toggle('active', b.getAttribute('data-tab')===tab);

  if(tab==='home') renderHome();
  if(tab==='symptoms') renderSymptoms();
  if(tab==='medicine') renderMedicine();
  if(tab==='rx') renderRx();

  if(tab==='wellness') renderWellness();
  applyLangToDOM();
}

  return [];
}
function visibleQuestions(domain, answers){
  return domainQuestions(domain).filter(q => !q.showIf || q.showIf(answers));
}
function classifyFever(a){
  if(a.tasteSmell==='yes' && (a.fever==='yes' || (a.cough && a.cough!=='none'))) return 'covid';
  if(a.fever==='yes' && a.vomiting==='yes') return 'feverVomit';
  if(a.sneezeEyes==='yes' && a.fever==='no' && a.nasal==='clear' && a.trigger==='yes') return 'allergy';
  if(a.fever==='yes'){
    const clusterPresent = a.headache==='yes' || a.fatigue==='yes' || a.sleepless==='yes' || (a.cough && a.cough!=='none') || a.soreBody==='yes';
    if(!clusterPresent) return 'feverIsolated';
    if(a.feverLevel==='high' && a.soreBody==='yes' && a.cough==='dry' && a.onset==='sudden') return 'flu';
    if(a.feverLevel==='mild' && a.soreBody==='yes' && a.onset==='gradual' && a.nasal==='clear') return 'cold';
    if(a.nasal==='colored') return 'sinusitis';
  }
  return 'general';
}
function classifyStomach(a){
  if(a.stomVomit==='yes' && a.stomFever==='yes') return 'gastro';
  if(a.stomVomit==='yes' && a.stomFever==='no') return 'stomVomitOnly';
  return 'stomGeneral';
}
function classifyUrinary(a){
  if(a.uriFlank==='yes' && a.uriPainful==='yes') return 'kidney';
  if(a.uriPainful==='yes' && a.uriDischarge==='yes') return 'genital';
  if(a.uriPainful==='yes' && a.uriFlank==='no' && a.uriDischarge==='no') return 'uti';
  return 'uriGeneral';
}
function classifyBreathing(a){
  if(a.breathDiff==='yes' && a.breathWheeze==='yes' && a.breathPattern==='seasonal') return 'asthmaSeasonal';
  if(a.breathDiff==='yes' && a.breathWheeze==='yes' && a.breathPattern==='infectious') return 'asthmaInfectious';
  if(a.breathDiff==='yes' && a.breathSmoker==='yes') return 'smokerBreath';
  if(a.breathDiff==='yes') return 'breathGeneral';
  return 'general';
}
function classifySkin(a){
  if(a.skinSpread==='yes' && a.skinFever==='yes') return 'skinInfection';
  if(a.skinItch==='yes' && a.skinTrigger==='yes' && a.skinFever==='no') return 'skinAllergy';
  if(a.skinRash==='yes' && a.skinFever==='yes' && a.skinSpread==='no') return 'skinViral';
  return 'skinGeneral';
}
function classifyHeart(a){
  if(a.heartChestPain==='yes' && (a.heartRadiate==='yes' || a.heartShortBreath==='yes' || a.heartSweat==='yes')) return 'heartEmergency';
  if(a.heartChestPain==='yes') return 'heartUrgent';
  if(a.heartPalp==='yes') return 'heartPalpBucket';
  return 'heartGeneral';
}
function classifyInjury(a){
  if(a.injBleeding==='yes') return 'injBleedingBucket';
  if(a.injSwelling==='yes' && a.injMove==='no') return 'injFracture';
  if(a.injType==='burn') return 'injBurn';
  if(a.injType==='sprain') return 'injSprain';
  return 'injGeneral';
}
function classifyPsych(a){
  if(a.psychMood==='yes' && a.psychInterest==='yes') return a.psychSupport==='no' ? 'psychLowNoSupport' : 'psychLow';
  if(a.psychAnxiety==='yes' && a.psychSleep==='yes') return a.psychSupport==='no' ? 'psychAnxiousNoSupport' : 'psychAnxious';
  if(a.psychSleep==='yes') return 'psychSleepBucket';
  return a.psychSupport==='no' ? 'psychGeneralNoSupport' : 'psychGeneral';
}
function classifyEye(a){
  if(a.entEyePain==='yes') return 'entEyeUrgent';
  if(a.entEyeRed==='yes') return 'entConj';
  return 'entEyeGeneral';
}
function classifyEarNasal(a){
  if(a.entEarPain==='yes' && a.entEarDischarge==='yes') return 'entEarInfection';
  if(a.entNasal==='yes' && a.entNasalTrigger==='yes') return 'allergy';
  if(a.entEarPain==='yes' || a.entEarDischarge==='yes') return 'entEarGeneral';
  if(a.entNasal==='yes') return 'entNasalGeneral';
  return 'general';
}
function classifySugar(a){
  const count = [a.sugarThirst,a.sugarUrination,a.sugarFatigue,a.sugarVision,a.sugarHealing].filter(v=>v==='yes').length;
  if(count>=3) return 'sugarHigh';
  if(count>=1) return 'sugarWatch';
  return 'sugarGeneral';
}
function classifyHepatitis(a){
  if(a.liverJaundice==='yes') return 'liverUrgent';
  if((a.liverPain==='yes' || a.liverNausea==='yes') && a.liverFatigue==='yes') return 'liverWatch';
  return 'liverGeneral';
}
function classifyWomen(a){
  if(a.womenBleeding==='yes') return 'womenBleed';
  if(a.womenPregnant==='yes' && a.womenPain==='yes') return 'womenPreg';
  if(a.womenDischarge==='yes') return 'womenDischargeBucket';
  if(a.womenCycle==='yes') return 'womenCycleBucket';
  return 'womenGeneral';
}
function classifyAnswers(domain, a){
  if(domain==='fever') return classifyFever(a);
  if(domain==='stomach') return classifyStomach(a);
  if(domain==='urinary') return classifyUrinary(a);
  if(domain==='breathing') return classifyBreathing(a);
  if(domain==='skin') return classifySkin(a);
  if(domain==='heart') return classifyHeart(a);
  if(domain==='injury') return classifyInjury(a);
  if(domain==='psych') return classifyPsych(a);
  if(domain==='eye') return classifyEye(a);
  if(domain==='earnasal') return classifyEarNasal(a);
  if(domain==='sugar') return classifySugar(a);
  if(domain==='hepatitis') return classifyHepatitis(a);
  if(domain==='women') return classifyWomen(a);
  return 'general';
}

let checker = { active:false, domain:null, answers:{}, history:[], result:null };

function startChecker(){
  checker = { active:true, domain:null, answers:{}, history:[], result:null };
  renderSymptoms();
}
function chooseDomain(domain){
  checker.domain = domain;
  checker.answers = {};
  checker.history = [];
  checker.result = null;
  renderSymptoms();
}
function enumerateCombos(remainingQs){
  let combos = [{}];
  for(const q of remainingQs){
    const next = [];
    for(const c of combos){
      for(const [val] of q.opts){
        next.push({...c, [q.id]: val});
      }
    }
    combos = next;
  }
  return combos;
}
function checkDetermined(domain, answers, remainingQs){
  if(remainingQs.length === 0) return classifyAnswers(domain, answers);
  const combos = enumerateCombos(remainingQs);
  let result = null;
  for(const c of combos){
    const outcome = classifyAnswers(domain, {...answers, ...c});
    if(result === null) result = outcome;
    else if(outcome !== result) return null;
  }
  return result;
}
function answerQuestion(qid, val){
  checker.answers[qid] = val;
  checker.history.push(qid);
  const qsAll = visibleQuestions(checker.domain, checker.answers);
  const remaining = qsAll.filter(q => !(q.id in checker.answers));
  const determined = checkDetermined(checker.domain, checker.answers, remaining);
  if(determined){
    checker.result = determined;
    const b = BUCKET_MAP[checker.result];
    pushActivity('Guided check result: '+STR.en[b.title], 'رہنمائی شدہ چیک کا نتیجہ: '+STR.ur[b.title]);
  }
  renderSymptoms();
}
function checkerBack(){
  if(checker.history.length === 0){ checker.domain = null; renderSymptoms(); return; }
  const lastId = checker.history.pop();
  delete checker.answers[lastId];
  checker.result = null;
  renderSymptoms();
}
function retakeChecker(){ startChecker(); }
function exitChecker(){ checker = { active:false, domain:null, answers:{}, history:[], result:null }; renderSymptoms(); }

      </div>`;
  }

  const currentIndex = qs.findIndex(q => !(q.id in checker.answers));
  const q = qs[currentIndex];
  const pct = Math.round((currentIndex / qs.length) * 100);
  return `
    ${exitRow}
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
      <div class="progress-label">${t('qOf')} ${currentIndex+1} ${t('ofWord')} ${qs.length}</div>
    </div>
    <div class="q-card">

        `).join('')}
      </div>
      <div class="q-nav"><button class="btn-secondary" onclick="checkerBack()">${t('back')}</button></div>
    </div>`;
}

function runMedicineSearch(query){
  if(!query || !query.trim()){ showToast(t('medEnterName')); return; }

  lastMedResult = { query, match, img: pendingMedImg };
  pendingMedImg = null;
  state.medHistory = [query.trim(), ...state.medHistory.filter(x=>x.toLowerCase()!==query.trim().toLowerCase())].slice(0,6);
  saveData();
  const label = match ? (LANG==='en'?match.name_en:match.name_ur) : query.trim();
  pushActivity('Looked up medicine: '+label, 'دوا تلاش کی: '+label);

function renderMedResult(result){

  const generic = LANG==='en' ? match.generic_en : match.generic_ur;
  const cls = LANG==='en' ? match.class_en : match.class_ur;
  const uses = LANG==='en' ? match.uses_en : match.uses_ur;
  const prec = LANG==='en' ? match.precautions_en : match.precautions_ur;
  const side = LANG==='en' ? match.side_en : match.side_ur;
  const exclude = new Set([match.name_en.toLowerCase(), match.generic_en.toLowerCase()]);
  const altBrands = match.aliases.filter(a => !exclude.has(a)).map(a => a.charAt(0).toUpperCase()+a.slice(1));

      ${altBrands.length ? `
      <div class="med-section-label">${t('medAlsoSoldAs')}</div>
      <div>${altBrands.map(b=>`<span class="med-recent-chip">${b}</span>`).join('')}</div>

      <div class="disclaimer" style="margin-top:12px;">⚠️ ${t('medDisclaimer')}</div>
    </div>`;
}

/* ---- Pharmacy locator ---- */
let userLoc = null;
let pharmMap = null;
let locating = false;
const SAMPLE_PHARM_OFFSETS = [
  { name:'City Care Pharmacy', dLat:0.0042, dLng:0.0058, hours:'9:00 AM – 11:00 PM', phone:'+920000000001' },
  { name:'Al-Shifa Pharmacy', dLat:-0.0051, dLng:0.0031, hours:'24 hours', phone:'+920000000002' },
  { name:'Wellcare Pharmacy', dLat:0.0023, dLng:-0.0067, hours:'8:00 AM – 12:00 AM', phone:'+920000000003' },
  { name:'Family Health Pharmacy', dLat:-0.0061, dLng:-0.0038, hours:'9:00 AM – 10:00 PM', phone:'+920000000004' },
];
function haversineKm(lat1,lng1,lat2,lng2){
  const R=6371, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function locatePharmacies(){
  locating = true;
  renderPharmacy();
  if(!navigator.geolocation){ locating=false; showToast(t('pharmLocError')); renderPharmacy(); return; }
  navigator.geolocation.getCurrentPosition(
    pos => { userLoc = { lat: pos.coords.latitude, lng: pos.coords.longitude }; locating=false; renderPharmacy(); },
    err => { locating=false; showToast(t('pharmLocError')); renderPharmacy(); },
    { enableHighAccuracy:true, timeout:10000 }
  );
}
function renderPharmacy(){
  const el = document.getElementById('screen-pharmacy');
  if(!userLoc){
    el.innerHTML = `
      <h2 style="margin-top:14px;font-size:19px;">${t('pharmTitle')}</h2>
      <p style="font-size:12.5px;color:var(--ink-soft);margin-top:6px;line-height:1.5;">${t('pharmSub')}</p>
      <button class="btn-primary" style="margin-top:16px;" onclick="locatePharmacies()" ${locating?'disabled':''}>
        📍 ${locating ? t('pharmLocating') : t('pharmUseLocation')}
      </button>
    `;
    return;
  }
  const pharmacies = SAMPLE_PHARM_OFFSETS.map(p=>{
    const lat = userLoc.lat + p.dLat, lng = userLoc.lng + p.dLng;
    const dist = haversineKm(userLoc.lat, userLoc.lng, lat, lng);
    return { ...p, lat, lng, dist };
  }).sort((a,b)=>a.dist-b.dist);

  const listHtml = pharmacies.map(p=>`
    <div class="pharm-card">
      <div class="pharm-top">
        <div>
          <div class="pharm-name">${p.name}</div>
          <div class="pharm-hours">${t('pharmHours')}: ${p.hours}</div>
        </div>
        <div class="pharm-dist">${p.dist.toFixed(1)} km ${t('pharmAway')}</div>
      </div>
      <div class="pharm-actions">
        <a class="call-link" href="tel:${p.phone}">📞 ${t('pharmCall')}</a>
        <a class="dir-link" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}" target="_blank" rel="noopener">🧭 ${t('pharmDirections')}</a>
      </div>
    </div>`).join('');

  el.innerHTML = `
    <h2 style="margin-top:14px;font-size:19px;">${t('pharmTitle')}</h2>
    <p style="font-size:12.5px;color:var(--ink-soft);margin-top:6px;line-height:1.5;">${t('pharmSub')}</p>
    <div id="pharmMapDiv"></div>
    <div class="sample-note">ℹ️ ${t('pharmSampleNote')}</div>
    <button class="btn-secondary" style="margin-top:14px;" onclick="locatePharmacies()">↻ ${t('pharmRetryLocation')}</button>
    <div style="margin-top:18px;">${listHtml}</div>
  `;
  setTimeout(()=>{
    if(pharmMap){ pharmMap.remove(); pharmMap=null; }
    const mapEl = document.getElementById('pharmMapDiv');
    if(!mapEl || typeof L === 'undefined') return;
    pharmMap = L.map('pharmMapDiv').setView([userLoc.lat, userLoc.lng], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
    }).addTo(pharmMap);
    L.marker([userLoc.lat, userLoc.lng]).addTo(pharmMap).bindPopup(t('pharmYouAreHere'));
    pharmacies.forEach(p => L.marker([p.lat, p.lng]).addTo(pharmMap).bindPopup(p.name));
  }, 60);
}
